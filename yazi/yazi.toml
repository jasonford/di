[opener]
edit = [
  { run = "sh -c 'exec yazi-edit \"$@\"' sh %s", block = true, for = "unix" },
]

[open]
prepend_rules = [
  { mime = "text/*", use = "edit" },
  { url = "Dockerfile", use = "edit" },
  { url = "Makefile", use = "edit" },
  { url = ".env*", use = "edit" },
  { url = "*.json", use = "edit" },
  { url = "*.jsonc", use = "edit" },
  { url = "*.md", use = "edit" },
  { url = "*.txt", use = "edit" },
  { url = "*.toml", use = "edit" },
  { url = "*.yaml", use = "edit" },
  { url = "*.yml", use = "edit" },
  { url = "*.lua", use = "edit" },
  { url = "*.vim", use = "edit" },
  { url = "*.sh", use = "edit" },
  { url = "*.bash", use = "edit" },
  { url = "*.zsh", use = "edit" },
  { url = "*.py", use = "edit" },
  { url = "*.js", use = "edit" },
  { url = "*.jsx", use = "edit" },
  { url = "*.ts", use = "edit" },
  { url = "*.tsx", use = "edit" },
  { url = "*.css", use = "edit" },
  { url = "*.scss", use = "edit" },
  { url = "*.html", use = "edit" },
  { url = "*.xml", use = "edit" },
  { url = "*.sql", use = "edit" },
  { url = "*.gitignore", use = "edit" },
  { url = "*.gitattributes", use = "edit" },
  { url = "*.gitmodules", use = "edit" },
]
